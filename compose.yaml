# Local dependencies only; run client and server with npm.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: marauders
      POSTGRES_PASSWORD: marauders_dev
      POSTGRES_DB: marauders_map
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/20-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marauders -d marauders_map"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
